<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dendrita · software-tools (mapa mental por familias)</title>
<style>
:root{
  --st-bg:#0b0f17; --st-ink:#eef2f7; --st-muted:#98a2b3; --st-faint:#475467;
  --st-accent:#7dd3fc; --st-line:rgba(152,162,179,.2);
  --st-font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --panel-w:380px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--st-bg);color:var(--st-ink);font-family:system-ui,sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(40rem 40rem at 18% 50%,rgba(125,211,252,.06),transparent 60%)}
a{color:var(--st-accent);text-decoration:none}
a:hover{text-decoration:underline}

.hd{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:.9rem;
  padding:.6rem 1rem;background:rgba(11,15,23,.82);border-bottom:1px solid var(--st-line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hd__brand{font-weight:600;font-size:.92rem;white-space:nowrap}
.hd__brand small{color:var(--st-muted);font-weight:400;font-family:var(--st-font-mono);font-size:.66rem;
  letter-spacing:.12em;text-transform:uppercase;margin-left:.45rem}
.hd__act{margin-left:auto;display:flex;align-items:center;gap:.8rem}
.hd__act button{background:none;border:1px solid var(--st-line);color:var(--st-muted);border-radius:7px;
  font-family:var(--st-font-mono);font-size:.68rem;letter-spacing:.08em;padding:.34rem .6rem;cursor:pointer}
.hd__act button:hover{color:var(--st-ink);border-color:var(--st-muted)}
.hd__search{position:relative;width:min(340px,46vw)}
.hd__search input{width:100%;background:#121826;border:1px solid var(--st-line);border-radius:8px;
  color:var(--st-ink);font:inherit;font-size:.85rem;padding:.5rem .8rem .5rem 2rem;outline:none}
.hd__search input:focus{border-color:var(--st-accent)}
.hd__search::before{content:"⌕";position:absolute;left:.62rem;top:50%;transform:translateY(-54%);
  color:var(--st-muted);font-size:1rem}
.dd{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#0f1520;border:1px solid var(--st-line);
  border-radius:8px;max-height:320px;overflow:auto;display:none;z-index:50}
.dd.is-open{display:block}
.dd button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--st-ink);
  font:inherit;font-size:.82rem;padding:.5rem .8rem;cursor:pointer}
.dd button:hover{background:rgba(125,211,252,.12)}
.dd button span{display:block;color:var(--st-muted);font-size:.68rem;font-family:var(--st-font-mono)}
.dd .empty{color:var(--st-muted);font-size:.78rem;padding:.6rem .8rem}

svg#map{position:fixed;inset:0;width:100%;height:100%;display:block}
.branch{fill:none;stroke-width:1.6;stroke-linecap:round}
.branch.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw .8s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.leaf-pop{animation:pop .38s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.node{cursor:pointer}
.node:hover .kk{filter:brightness(1.4)}
text{font-family:var(--st-font-mono)}
.leafLbl{font-size:10px;fill:#b7c2d1;pointer-events:none;paint-order:stroke;stroke:#0b0f17;stroke-width:3px;stroke-linejoin:round}
.leafLbl.sel{fill:var(--st-ink);font-weight:700}
.link{fill:none;stroke-width:1;opacity:0;animation:fadein .6s ease forwards}
@keyframes fadein{to{opacity:.85}}

.panel{position:fixed;top:0;right:0;bottom:0;width:var(--panel-w);background:#0e1420;border-left:1px solid var(--st-line);
  z-index:45;transform:translateX(102%);transition:transform .28s ease;display:flex;flex-direction:column}
.panel.is-open{transform:none}
.panel__inner{overflow:auto;padding:4.4rem 1.4rem 2rem}
.panel__close{position:absolute;top:.7rem;right:.8rem;background:none;border:1px solid var(--st-line);color:var(--st-muted);
  border-radius:8px;width:2rem;height:2rem;font-size:1rem;cursor:pointer}
.panel__close:hover{color:var(--st-ink)}
.panel__meta{font-family:var(--st-font-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--st-muted)}
.panel h2{font-size:1.35rem;margin:.25rem 0 .7rem}
.panel p.ctx{font-size:.9rem;line-height:1.6}
.panel h3{font-family:var(--st-font-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--st-muted);margin:1.1rem 0 .4rem}
.chips{display:flex;flex-wrap:wrap;gap:.32rem}
.chips button{background:rgba(152,162,179,.1);border:1px solid var(--st-line);border-radius:999px;color:var(--st-muted);
  font-family:var(--st-font-mono);font-size:.68rem;padding:.16rem .55rem;cursor:pointer}
.chips button:hover{color:var(--st-accent);border-color:var(--st-accent)}
.rel{display:flex;flex-direction:column;gap:.3rem}
.rel button{text-align:left;background:none;border:0;color:var(--st-accent);font:inherit;font-size:.85rem;cursor:pointer;padding:.1rem 0}
.rel button:hover{text-decoration:underline}
.panel .live{display:inline-block;margin-top:1.2rem;font-family:var(--st-font-mono);font-size:.72rem}

.hint{position:fixed;bottom:.7rem;left:1rem;z-index:30;color:var(--st-muted);
  font-family:var(--st-font-mono);font-size:.66rem;letter-spacing:.05em;max-width:82vw}
@media (max-width:760px){
  .hd__brand small{display:none}
  .panel{top:auto;left:0;right:0;width:auto;max-height:62vh;border-left:0;border-top:1px solid var(--st-line);
    transform:translateY(103%)}
  .panel.is-open{transform:none}
  .panel__inner{padding:3.4rem 1.1rem 1.4rem}
  .hd__act button{display:none}
}
.noanim *{animation:none!important;transition:none!important}
.noanim .branch.draw{stroke-dasharray:none;stroke-dashoffset:0}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (min-width: 761px){.panel-open .hd__act{padding-right:calc(var(--panel-w) + 1.25rem)}.panel-open .hint{max-width:calc(100vw - var(--panel-w) - 2rem)}}
</style>
</head>
<body>
<header class="hd">
  <div class="hd__brand">software-tools<small>mapa · dendrita · familias</small></div>
  <div class="hd__act">
    <button id="collapse">contraer todo</button>
    <div class="hd__search">
      <input id="q" type="search" placeholder="Buscar herramienta, tag, contexto…" autocomplete="off" aria-label="Buscar">
      <div class="dd" id="dd" role="listbox"></div>
    </div>
  </div>
</header>

<svg id="map" role="application" aria-label="Mapa mental del archivo (dendrita: categorías → familias → herramientas)"></svg>

<aside class="panel" id="panel" aria-hidden="true">
  <button class="panel__close" id="pclose" aria-label="Cerrar">×</button>
  <div class="panel__inner" id="pinner"></div>
</aside>

<div class="hint">clic en categoría → familias · clic en familia → herramientas · clic en herramienta → ficha · hilos = relacionadas</div>

<script>
(() => {
'use strict';
// Bootstrap: los datos se cargan dinámicamente (?data=<ruta>, por defecto ../data.js)
// y el motor arranca recién en onload. Solo se aceptan rutas del mismo origen.
const qs = new URLSearchParams(location.search);
if (qs.get('static')) document.documentElement.classList.add('noanim');
const dataUrl = new URL(qs.get('data') || '../data.js', location.href);
function fatal(msg) {
  const d = document.createElement('div');
  d.className = 'hint'; d.style.cssText = 'top:4rem;bottom:auto;color:#f87171';
  d.id = 'data-error'; d.textContent = msg;
  document.body.appendChild(d);
}
if (dataUrl.origin !== location.origin) fatal('Datos: solo se admiten rutas del mismo origen.');
else {
  const sc = document.createElement('script');
  sc.src = dataUrl.href;
  const validData = d => !!d && Array.isArray(d.categories) && Array.isArray(d.tools)
    && d.tools.every(t => t && typeof t.slug === 'string' && typeof t.name === 'string');
  sc.onload = () => validData(window.ST_DATA)
    ? init(window.ST_DATA) : fatal('Datos inválidos: falta window.ST_DATA.');
  sc.onerror = () => fatal('No se pudo cargar ' + dataUrl.pathname);
  document.head.appendChild(sc);
}

function init(D) {
const CAT_COLOR = {editor:'#7dd3fc',lenguaje:'#a78bfa',database:'#34d399',infra:'#fbbf24',
                   os:'#f472b6',tool:'#94a3b8',other:'#64748b'};
const PALETTE = ['#7dd3fc','#a78bfa','#34d399','#fbbf24','#f472b6','#fb923c','#2dd4bf','#a3e635'];
const catBySlug  = Object.fromEntries(D.categories.map(c => [c.slug, c]));
const toolBySlug = Object.fromEntries(D.tools.map(t => [t.slug, t]));
// color de categoría: dato → mapa local → hash determinista del slug
const slugHash = s => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; };
const colorOf = c => c.color || CAT_COLOR[c.slug] || PALETTE[slugHash(c.slug) % PALETTE.length];
const LABEL_MIN = 30;      // separación mínima (px) para etiquetas no activas (familias y hojas)
const LABEL_CAT_MIN = 34;  // ídem para categorías
const MIN_SP = 24;         // paso vertical mínimo (px) del abanico antes de recortar con chip de desborde
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const panelIsOpen = () => document.getElementById('panel').classList.contains('is-open');
const isMobile = () => window.innerWidth <= 760;

// columnas del árbol; en móvil estrecho se comprimen para que la columna de hojas quede dentro del viewport
const xCols = (compact, W) => {
  const xCat = compact ? 170 : 268, xSub = xCat + (compact ? 150 : 205);
  const xLeaf = xSub + (compact ? 165 : 228);
  if (compact && xLeaf > W - 32) return {xRoot: 44, xCat: 112, xSub: 212, xLeaf: 317, tight: true};
  return {xRoot: compact ? 64 : 104, xCat, xSub, xLeaf, tight: false};
};

// abanico de hojas: 1 columna hasta FAN_SINGLE; más → multicolumna con tope de alto y de ancho.
// Presupuesto horizontal: la última columna debe quedar a la izquierda de xMax (el panel es un overlay).
const FAN_SINGLE = 14, SP = 40, MAX_COLS = 4;
const fanPlan = (n, availH, xCol, W, compact, open) => {
  const colW = compact ? 150 : 200;
  const xMax = W - (open && !compact ? 380 : 24);  // en móvil el panel es una hoja inferior, no cubre columnas
  const maxCols = Math.max(1, Math.floor((xMax - 8 - xCol) / colW) + 1);
  const colsCap = Math.min(MAX_COLS, maxCols);
  const rowsMax = Math.max(4, Math.floor(availH / SP) + 1);
  const cap = Math.min(620, availH);
  let cols = Math.min(colsCap, n > FAN_SINGLE ? Math.max(2, Math.ceil(n / rowsMax)) : 1);
  let rpc = Math.ceil(n / cols);
  // primero se abren columnas (hasta colsCap); comprimir el paso es el último recurso
  while ((rpc - 1) * SP > cap && cols < colsCap) { cols++; rpc = Math.ceil(n / cols); }
  let shown = n, overflow = 0;
  const rows = Math.floor(cap / MIN_SP) + 1;
  if (rpc > rows) {
    // no cabe ni comprimido a MIN_SP: se muestran slots-1 hojas + 1 chip de desborde
    shown = cols * rows - 1; overflow = n - shown; rpc = rows;
  }
  const sp = rpc > 1 ? Math.min(SP, cap / (rpc - 1)) : SP;
  return {cols, rpc, sp, shown, overflow, xMax, colW};
};
if (qs.get('selftest')) window.__fanPlan = fanPlan;  // gancho de la verificación numérica (README)

const svg  = document.getElementById('map');
const panel= document.getElementById('panel');
const pinner=document.getElementById('pinner');
const qEl  = document.getElementById('q');
const ddEl = document.getElementById('dd');

const state = { cat: null, sub: null, selected: null };
const LAST_POS = new Map();
let W, H;

const NS = 'http://www.w3.org/2000/svg';
function mk(tag, attrs, parent) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(el);
  return el;
}
function tip(g, text) { mk('title', {}, g).textContent = text; }
function short(n, w=20) { return n.length > w ? n.slice(0, w-1) + '…' : n; }
function hex2rgb(h){const v=parseInt(h.slice(1),16);return `${(v>>16)&255},${(v>>8)&255},${v&255}`;}

function layout() {
  W = window.innerWidth; H = window.innerHeight;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
}

function render() {
  LAST_POS.clear();
  layout();
  svg.innerHTML = '';
  const LABELS = [];
  const compact = isMobile();
  const {xRoot, xCat, xSub, xLeaf, tight} = xCols(compact, W);
  const cy = H/2 + 6;

  const cats = D.categories;
  const n = cats.length;
  const spread = Math.min(compact ? 84 : 112, (H - 190) / Math.max(n - 1, 1));
  const yOf = i => cy + (i - (n-1)/2) * spread;

  // nervio con curvatura (dobla hacia el lado del destino)
  const nerve = (x1, y1, x2, y2, stroke, w, dy0=2) => {
    const bow = (y2 >= y1 ? 1 : -1) * 22;
    mk('path', {d: `M ${x1} ${y1+dy0} C ${x1+56} ${y1+bow}, ${x2-40} ${y2}, ${x2-8} ${y2}`,
      class:'branch draw', stroke, 'stroke-width': w});
  };

  // tronco
  const tg = mk('g', {});
  mk('circle', {cx:xRoot, cy, r:34, fill:'#121a29', stroke:'#7dd3fc', 'stroke-width':2.2}, tg);
  mk('text', {x:xRoot, y:cy+5, fill:'#7dd3fc', 'font-size':14, 'font-weight':700, 'text-anchor':'middle'}, tg)
    .textContent = 'st';
  mk('text', {x:xRoot, y:cy+56, fill:'#eef2f7', 'font-size':11.5, 'text-anchor':'middle',
    style:'paint-order:stroke;stroke:#0b0f17;stroke-width:3px'}, tg)
    .textContent = 'software-tools';

  const colW = compact ? 150 : 200;
  const fanLayout = (n, availH, xCol) => fanPlan(n, availH, xCol, W, compact, panelIsOpen());

  // hojas de una lista: primero TODOS los nervios, luego nodos+etiquetas
  const drawLeaves = (tl, srcX, srcY, xCol, color) => {
    if (!tl.length) return;
    const availTop = 84, availBot = H - 48;
    const {cols, rpc, sp, shown, overflow, xMax} = fanLayout(tl.length, availBot - availTop, xCol);
    const total = tl.length;
    tl = tl.slice(0, shown);
    const fanH = (rpc - 1) * sp;
    const cyF = Math.max(availTop + fanH/2, Math.min(availBot - fanH/2, srcY));
    const showAll = sp >= LABEL_MIN;
    for (const [k, t] of tl.entries()) {
      const col = Math.floor(k / rpc), row = k % rpc;
      const x = xCol + col * colW, ty = cyF - fanH/2 + row * sp;
      LAST_POS.set(t.slug, [x, ty]);
      const sel = state.selected === t.slug;
      nerve(srcX, srcY, x - 8, ty, sel ? '#eef2f7' : `rgba(${hex2rgb(color)},0.55)`, sel ? 1.8 : 1.3, 16);
    }
    for (const [k, t] of tl.entries()) {
      const [lx, ty] = LAST_POS.get(t.slug);
      const sel = state.selected === t.slug;
      const lg = mk('g', {class:'node leaf-pop', style:`animation-delay:${Math.min(k*16,420)}ms`});
      tip(lg, t.name + ' · ' + t.year);
      mk('circle', {class:'kk', cx:lx, cy:ty, r: sel ? 7.5 : (showAll ? 6 : 4),
        fill: sel ? '#eef2f7' : color, stroke:'#0b0f17', 'stroke-width':1}, lg);
      if (showAll || sel) {
        const lbl = mk('text', {x:lx+12, y:ty+3.5, class:'leafLbl' + (sel ? ' sel' : '')}, lg);
        lbl.textContent = `${short(t.name, cols > 1 ? (compact ? 14 : 20) : (compact ? 16 : 24))} · ${t.year}`;
      }
      lg.addEventListener('click', () => selectTool(t.slug));
    }
    if (overflow > 0) {
      const col = Math.floor(shown / rpc), row = shown % rpc;
      const x = xCol + col * colW, ty = cyF - fanH/2 + row * sp;
      const og = mk('g', {class:'node leaf-pop overflow', 'data-overflow': overflow});
      tip(og, `${overflow} de ${total} herramientas sin mostrar`);
      const cw = compact ? 150 : 172, cx0 = Math.min(x - 8, xMax - cw);  // el chip nunca pasa de xMax
      mk('rect', {x:cx0, y:ty-11, width:cw, height:22, rx:11,
        fill:'#101826', stroke:color, 'stroke-width':1.2, 'stroke-dasharray':'4 3'}, og);
      mk('text', {x:cx0+12, y:ty+3.5, class:'leafLbl'}, og).textContent =
        `+${overflow} más · usar búsqueda`;
      og.addEventListener('click', () => { qEl.focus(); });
      nerve(srcX, srcY, x - 8, ty, `rgba(${hex2rgb(color)},0.35)`, 1.1, 16);
    }
  };

  cats.forEach((cat, i) => {
    const y = yOf(i);
    const color = colorOf(cat);
    const open = state.cat === cat.slug;
    const rC = clamp(spread * 0.30, 10, 24);  // el nodo se achica si hay muchas categorías

    // rama principal (curva orgánica), arranca en el borde del tronco
    const dxT = xCat - xRoot, dyT = y - cy, lenT = Math.hypot(dxT, dyT) || 1;
    const sx0 = xRoot + 34*dxT/lenT, sy0 = cy + 34*dyT/lenT;
    const c1x = xRoot + (xCat - xRoot)*0.45, c1y = y + (i%2 ? 26 : -26);
    const d = `M ${sx0} ${sy0} C ${c1x} ${cy}, ${c1x} ${c1y}, ${xCat} ${y}`;
    mk('path', {d, class:'branch' + (open ? '' : ' draw'), stroke: `rgba(${hex2rgb(color)},${open?0.9:0.5})`});
    if (open) mk('path', {d, class:'branch draw', stroke: color, 'stroke-width': 2});

    // nodo de categoría
    const g = mk('g', {class:'node'});
    tip(g, `${cat.label} · ${cat.count}`);
    mk('circle', {class:'kk', cx:xCat, cy:y, r:rC, fill:'#101826', stroke:color, 'stroke-width': open?2.4:1.6}, g);
    mk('text', {x:xCat, y:y+(rC < 16 ? 3 : 4), fill:color, 'font-size': rC < 16 ? 8 : 10.5,
      'text-anchor':'middle', 'font-weight':700}, g)
      .textContent = cat.count;
    const onCatClick = () => {
      state.cat = open ? null : cat.slug;
      state.sub = null;
      if (state.selected && toolBySlug[state.selected].cat !== state.cat) state.selected = null;
      render();
    };
    if (spread >= LABEL_CAT_MIN || open)
      LABELS.push({x: xCat+rC+6, y: rC < 16 ? y+4 : y-9, text: cat.label, strong: open,
        size: 12, dim: '#98a2b3', halo: 3, onClick: onCatClick});
    g.addEventListener('click', onCatClick);

    if (!open) return;

    const subs = cat.subs || [];
    if (subs.length) {
      // segundo anillo: familias (fan vertical propio, clampado al viewport)
      const ns = subs.length;
      const spreadS = Math.min(compact ? 44 : 58, (H - 170) / Math.max(ns - 1, 1));
      let sh = 0;
      const top0 = y - (ns-1)/2 * spreadS, bot0 = y + (ns-1)/2 * spreadS;
      if (bot0 > H - 40) sh -= bot0 - (H - 40);
      if (top0 + sh < 86) sh += 86 - (top0 + sh);
      const yS = k => y + (k - (ns-1)/2) * spreadS + sh;
      const rS = clamp(spreadS * 0.33, 7, 14);

      // nervios (salida radial del hub) primero; etiquetas al final (z-order global)
      subs.forEach((s, k) => {
        const yy = yS(k);
        const ax = xSub-xCat, ay = yy-y, al = Math.hypot(ax, ay) || 1;
        nerve(xCat+(rC+2)*ax/al, y+(rC+2)*ay/al, xSub-rS-2, yy, `rgba(${hex2rgb(color)},0.5)`, 1.3, 16);
      });
      subs.forEach((s, k) => {
        const yy = yS(k);
        const openS = state.sub === s.slug;
        const sg = mk('g', {class:'node'});
        tip(sg, `${s.label} · ${s.count}`);
        mk('circle', {class:'kk', cx:xSub, cy:yy, r:rS, fill:'#101826', stroke:color, 'stroke-width': openS?2:1.4}, sg);
        if (rS >= 10) mk('text', {x:xSub, y:yy+3.5, fill:color, 'font-size':8.5, 'text-anchor':'middle', 'font-weight':700}, sg)
          .textContent = s.count;
        const onClick = () => {
          state.sub = openS ? null : s.slug;
          if (state.selected && toolBySlug[state.selected].sub !== state.sub) state.selected = null;
          render();
        };
        if (spreadS >= LABEL_MIN || openS)
          LABELS.push({x: xSub+rS+12, y: yy+3.5, text: short(s.label, tight ? 11 : compact ? 20 : 28),
            strong: openS, size: 10.5, dim: '#9aa7ba', halo: 3.5, onClick});
        sg.addEventListener('click', onClick);
        if (!openS) return;
        const tl = D.tools.filter(t => t.cat === cat.slug && t.sub === s.slug);
        drawLeaves(tl, xSub+rS, yy, xLeaf, color);
      });
    } else {
      // categoría plana (≤ umbral): herramientas directas
      const tl = D.tools.filter(t => t.cat === cat.slug);
      drawLeaves(tl, xCat+rC+2, y, xSub, color);
    }
  });

  if (state.selected) drawLinksFor(state.selected);

  // etiquetas al final: por encima de todas las curvas
  for (const L of LABELS) {
    const el = mk('text', {x:L.x, y:L.y, 'font-size': L.size,
      fill: L.strong ? '#eef2f7' : L.dim,
      style:`paint-order:stroke;stroke:#0b0f17;stroke-width:${L.halo}px;cursor:pointer`});
    el.textContent = L.text;
    el.addEventListener('click', L.onClick);
  }
}

function drawLinksFor(slug) {
  const t = toolBySlug[slug]; if (!t) return;
  const pos = LAST_POS;
  if (!pos.has(slug)) return;
  const [sx, sy] = pos.get(slug);
  const targets = t.rel.concat(t.succ && toolBySlug[t.succ] ? [t.succ] : []);
  targets.forEach((r, i) => {
    if (!pos.has(r)) return; // destino no visible → el panel lo lista
    const [tx, ty] = pos.get(r);
    const mx = (sx+tx)/2, my = Math.min(sy,ty) - Math.abs(tx-sx)*0.12 - 14;
    mk('path', {d:`M ${sx} ${sy} Q ${mx} ${my} ${tx} ${ty}`, class:'link',
      stroke: r === t.succ ? '#fbbf24' : 'rgba(238,242,247,.55)', style:`animation-delay:${i*60}ms`});
  });
}

function selectTool(slug, {expand=true} = {}) {
  const t = toolBySlug[slug]; if (!t) return;
  if (expand) { state.cat = t.cat; state.sub = t.sub || null; }
  state.selected = slug;
  openPanel(t);   // antes de render(): el presupuesto horizontal depende del estado del panel
  render();
}

/* ---------- panel ---------- */
function openPanel(t) {
  document.body.classList.add('panel-open');
  panel.classList.add('is-open');
  panel.setAttribute('aria-hidden','false');
  const cat = catBySlug[t.cat];
  const sub = t.sub && cat ? ((cat.subs || []).find(s => s.slug === t.sub) || null) : null;
  const years = t.until ? `${t.year} – ${t.until}` : `desde ${t.year}`;
  const path = [cat ? cat.label : t.cat, sub ? sub.label : null].filter(Boolean).join(' → ');
  pinner.innerHTML = `
    <div class="panel__meta">${path} · ${years}</div>
    <h2>${t.name}</h2>
    <p class="ctx">${t.ctx}</p>
    ${t.tags.length ? `<h3>Tags</h3><div class="chips">${t.tags.map(g => `<button data-tag="${g}">${g}</button>`).join('')}</div>` : ''}
    ${t.rel.length || t.succ ? `<h3>Relacionadas</h3><div class="rel">` +
      t.rel.map(r => toolBySlug[r] ? `<button data-go="${r}">↗ ${toolBySlug[r].name}</button>` : '').join('') +
      (t.succ && toolBySlug[t.succ] ? `<button data-go="${t.succ}">→ sucesora: ${toolBySlug[t.succ].name}</button>` : '') +
      `</div>` : ''}
    <a class="live" href="https://software-tools.pcabrera.com/tools/${t.slug}" target="_blank" rel="noopener">ver ficha completa ↗</a>`;
  pinner.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => selectTool(b.dataset.go)));
  pinner.querySelectorAll('[data-tag]').forEach(b => b.addEventListener('click', () => {
    qEl.value = b.dataset.tag; runSearch(b.dataset.tag); qEl.focus();
  }));
  pinner.scrollTop = 0;
}
function closePanel() { document.body.classList.remove('panel-open'); panel.classList.remove('is-open'); panel.setAttribute('aria-hidden','true'); }
document.getElementById('pclose').addEventListener('click', closePanel);
document.getElementById('collapse').addEventListener('click', () => {
  state.cat = null; state.sub = null; state.selected = null; render();
});

/* ---------- búsqueda ---------- */
const INDEX = D.tools.map(t => ({t, hay:(t.name+' '+t.slug+' '+t.tags.join(' ')+' '+t.ctx).toLowerCase()}));
function searchTools(q) {
  q = q.trim().toLowerCase(); if (!q) return [];
  const out = [];
  for (const {t, hay} of INDEX) {
    const name = t.name.toLowerCase(); let s = -1;
    if (name.startsWith(q)) s = 0; else if (name.includes(q)) s = 1;
    else if (t.tags.some(g => g.toLowerCase().includes(q))) s = 2;
    else if (hay.includes(q)) s = 3;
    if (s >= 0) out.push({t, s});
  }
  return out.sort((a,b)=>a.s-b.s||a.t.name.localeCompare(b.t.name)).slice(0,8).map(x=>x.t);
}
function runSearch(q) {
  const res = searchTools(q);
  ddEl.innerHTML='';
  if (!q.trim()) { ddEl.classList.remove('is-open'); return; }
  if (!res.length) { ddEl.innerHTML = `<div class="empty">sin resultados para «${q.trim()}»</div>`; ddEl.classList.add('is-open'); return; }
  res.forEach(t => {
    const b = document.createElement('button');
    const cat = catBySlug[t.cat];
    const sub = t.sub && cat ? ((cat.subs || []).find(s => s.slug === t.sub) || null) : null;
    b.innerHTML = `${t.name}<span>${[cat ? cat.label : t.cat, sub ? sub.label : null].filter(Boolean).join(' → ')} · ${t.year}</span>`;
    b.addEventListener('click', () => { ddEl.classList.remove('is-open'); qEl.value=''; selectTool(t.slug); });
    ddEl.appendChild(b);
  });
  ddEl.classList.add('is-open');
}
qEl.addEventListener('input', () => runSearch(qEl.value));
qEl.addEventListener('keydown', e => {
  if (e.key === 'Escape') { ddEl.classList.remove('is-open'); qEl.blur(); }
  if (e.key === 'Enter') { const f = ddEl.querySelector('button'); if (f) f.click(); }
});
document.addEventListener('click', e => { if (!e.target.closest('.hd__search')) ddEl.classList.remove('is-open'); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && panel.classList.contains('is-open')) closePanel();
  if (e.key === '/' && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); }
});

/* ---------- arranque ---------- */
render();
const dt = qs.get('tool'), dc = qs.get('cat'), ds = qs.get('sub');
if (dt && toolBySlug[dt]) selectTool(dt);
else if (dc && catBySlug[dc]) { state.cat = dc; if (ds) state.sub = ds; render(); }
}
})();
</script>
</body>
</html>
