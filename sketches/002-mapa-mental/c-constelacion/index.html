<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Maqueta C · Constelación — software-tools (mapa mental)</title>
<style>
:root{
  --st-bg:#0b0f17; --st-ink:#eef2f7; --st-muted:#98a2b3; --st-faint:#475467;
  --st-accent:#7dd3fc; --st-line:rgba(152,162,179,.2);
  --st-font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --panel-w:380px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#070b12;color:var(--st-ink);font-family:system-ui,sans-serif;overflow:hidden}
a{color:var(--st-accent);text-decoration:none}
a:hover{text-decoration:underline}

.hd{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:.9rem;
  padding:.6rem 1rem;background:rgba(7,11,18,.72);border-bottom:1px solid var(--st-line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hd__brand{font-weight:600;font-size:.92rem;white-space:nowrap}
.hd__brand small{color:var(--st-muted);font-weight:400;font-family:var(--st-font-mono);font-size:.66rem;
  letter-spacing:.12em;text-transform:uppercase;margin-left:.45rem}
.hd__act{margin-left:auto;display:flex;align-items:center;gap:.8rem}
.hd__act button{background:none;border:1px solid var(--st-line);color:var(--st-muted);border-radius:7px;
  font-family:var(--st-font-mono);font-size:.68rem;letter-spacing:.08em;padding:.34rem .6rem;cursor:pointer}
.hd__act button:hover{color:var(--st-ink);border-color:var(--st-muted)}
.hd__search{position:relative;width:min(340px,46vw)}
.hd__search input{width:100%;background:#0d1420;border:1px solid var(--st-line);border-radius:8px;
  color:var(--st-ink);font:inherit;font-size:.85rem;padding:.5rem .8rem .5rem 2rem;outline:none}
.hd__search input:focus{border-color:var(--st-accent)}
.hd__search::before{content:"⌕";position:absolute;left:.62rem;top:50%;transform:translateY(-54%);
  color:var(--st-muted);font-size:1rem}
.dd{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#0d1420;border:1px solid var(--st-line);
  border-radius:8px;max-height:320px;overflow:auto;display:none;z-index:50}
.dd.is-open{display:block}
.dd button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--st-ink);
  font:inherit;font-size:.82rem;padding:.5rem .8rem;cursor:pointer}
.dd button:hover{background:rgba(125,211,252,.12)}
.dd button span{display:block;color:var(--st-muted);font-size:.68rem;font-family:var(--st-font-mono)}
.dd .empty{color:var(--st-muted);font-size:.78rem;padding:.6rem .8rem}

canvas#sky{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas#sky.drag{cursor:grabbing}

.panel{position:fixed;top:0;right:0;bottom:0;width:var(--panel-w);background:#0c121e;border-left:1px solid var(--st-line);
  z-index:45;transform:translateX(102%);transition:transform .28s ease;display:flex;flex-direction:column}
.panel.is-open{transform:none}
.panel__inner{overflow:auto;padding:4.4rem 1.4rem 2rem}
.panel__close{position:absolute;top:.7rem;right:.8rem;background:none;border:1px solid var(--st-line);color:var(--st-muted);
  border-radius:8px;width:2rem;height:2rem;font-size:1rem;cursor:pointer}
.panel__close:hover{color:var(--st-ink)}
.panel__meta{font-family:var(--st-font-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--st-muted)}
.panel h2{font-size:1.35rem;margin:.25rem 0 .7rem}
.panel p.ctx{font-size:.9rem;line-height:1.6}
.panel h3{font-family:var(--st-font-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--st-muted);margin:1.1rem 0 .4rem}
.chips{display:flex;flex-wrap:wrap;gap:.32rem}
.chips button{background:rgba(152,162,179,.1);border:1px solid var(--st-line);border-radius:999px;color:var(--st-muted);
  font-family:var(--st-font-mono);font-size:.68rem;padding:.16rem .55rem;cursor:pointer}
.chips button:hover{color:var(--st-accent);border-color:var(--st-accent)}
.rel{display:flex;flex-direction:column;gap:.3rem}
.rel button{text-align:left;background:none;border:0;color:var(--st-accent);font:inherit;font-size:.85rem;cursor:pointer;padding:.1rem 0}
.rel button:hover{text-decoration:underline}
.panel .live{display:inline-block;margin-top:1.2rem;font-family:var(--st-font-mono);font-size:.72rem}

.hint{position:fixed;bottom:.7rem;left:1rem;z-index:30;color:var(--st-muted);
  font-family:var(--st-font-mono);font-size:.66rem;letter-spacing:.05em;max-width:46vw}
.legend{position:fixed;bottom:2.7rem;left:1rem;z-index:30;display:flex;gap:.8rem;flex-wrap:wrap;max-width:44vw}
.legend span{display:flex;align-items:center;gap:.3rem;font-family:var(--st-font-mono);font-size:.64rem;color:var(--st-muted)}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
@media (max-width:760px){
  .hd__brand small{display:none}
  .hd__act button{display:none}
  .legend{display:none}
  .panel{top:auto;left:0;right:0;width:auto;max-height:62vh;border-left:0;border-top:1px solid var(--st-line);
    transform:translateY(103%)}
  .panel.is-open{transform:none}
  .panel__inner{padding:3.4rem 1.1rem 1.4rem}
}
.noanim *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (min-width: 761px){.panel-open .hd__act{padding-right:calc(var(--panel-w) - 1rem)}}
</style>
</head>
<body>
<header class="hd">
  <div class="hd__brand">software-tools<small>mapa · constelación</small></div>
  <div class="hd__act">
    <button id="reset">reiniciar vista</button>
    <div class="hd__search">
      <input id="q" type="search" placeholder="Buscar herramienta, tag, contexto…" autocomplete="off" aria-label="Buscar">
      <div class="dd" id="dd" role="listbox"></div>
    </div>
  </div>
</header>

<canvas id="sky" role="application" aria-label="Mapa mental del archivo (constelación)"></canvas>

<aside class="panel" id="panel" aria-hidden="true">
  <button class="panel__close" id="pclose" aria-label="Cerrar">×</button>
  <div class="panel__inner" id="pinner"></div>
</aside>

<div class="hint">arrastra para mover · rueda para acercar · clic en un nodo abre su ficha · los hilos brillantes = relaciones</div>
<div class="legend" id="legend"></div>

<script src="../data.js"></script>
<script>
(() => {
'use strict';
const D = window.ST_DATA;
if (new URLSearchParams(location.search).get('static')) document.documentElement.classList.add('noanim');
const CAT_COLOR = {editor:'#7dd3fc',lenguaje:'#a78bfa',database:'#34d399',infra:'#fbbf24',
                   os:'#f472b6',tool:'#94a3b8',other:'#64748b'};
const catBySlug  = Object.fromEntries(D.categories.map(c => [c.slug, c]));
const toolBySlug = Object.fromEntries(D.tools.map(t => [t.slug, t]));
const colorOf    = c => CAT_COLOR[c] || '#94a3b8';

const cv = document.getElementById('sky'), ctx = cv.getContext('2d');
const panel = document.getElementById('panel'), pinner = document.getElementById('pinner');
const qEl = document.getElementById('q'), ddEl = document.getElementById('dd');
const isMobile = () => window.innerWidth <= 760;

/* ---------- mundo: posiciones deterministas por hash ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash32(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

const HUBS = {}; // cat -> {x,y,r}
const WORLD = {rx: 940, ry: 640};
const NODES = []; // {slug,cat,x,y,r}
(function buildWorld(){
  const cats = D.categories;
  cats.forEach((c, i) => {
    const a = (i / cats.length) * Math.PI * 2 - Math.PI/2 + 0.35;
    const hx = Math.cos(a) * WORLD.rx, hy = Math.sin(a) * WORLD.ry;
    const tools = D.tools.filter(t => t.cat === c.slug);
    const spread = 88 + tools.length * 5.2;
    HUBS[c.slug] = {x:hx, y:hy, r:spread, color: colorOf(c.slug), label:c.label, count:tools.length, cat:c};
    tools.forEach((t, k) => {
      const rnd = mulberry32(hash32(t.slug));
      const ang = k * 2.399963 + rnd() * 1.2;
      const rad = 46 + (k % 9) * 22 + rnd() * 48;
      NODES.push({slug:t.slug, cat:c.slug, x: hx + Math.cos(ang)*rad, y: hy + Math.sin(ang)*rad*0.82, r:6.5});
    });
  });
})();

/* estrellas (parallax) */
const STARS = [];
(function(){ const r0 = mulberry32(20261015);
  for (let i=0;i<170;i++) STARS.push({x:(r0()-0.5)*4200, y:(r0()-0.5)*3000, s:r0()*1.4+0.3, a:r0()*0.5+0.15});
})();

/* ---------- cámara ---------- */
const cam = {x:0, y:0, z:0.4};
const camT = {x:0, y:0, z:0.4};
let W,H, dpr;
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const zFit = Math.min(W/2600, H/1950) * 1.12;
  if (state.mode === 'init') { cam.z = camT.z = zFit; state.mode = 'idle'; }
}
window.addEventListener('resize', resize);

const state = { selected:null, activeCat:null, hover:null, mode:'init' };
function toScreen(wx, wy){ return [ (wx - cam.x)*cam.z + W/2 + (panelOpen() && !isMobile() ? -170 : 0), (wy - cam.y)*cam.z + H/2 ]; }
function panelOpen(){ return panel.classList.contains('is-open'); }

/* ---------- interacción ---------- */
let dragging=false, moved=0, lastX=0, lastY=0;
cv.addEventListener('pointerdown', e => { dragging=true; moved=0; lastX=e.clientX; lastY=e.clientY; cv.classList.add('drag'); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (dragging) {
    const dx=e.clientX-lastX, dy=e.clientY-lastY; moved+=Math.abs(dx)+Math.abs(dy);
    camT.x -= dx/cam.z; camT.y -= dy/cam.z; cam.x=camT.x; cam.y=camT.y;
    lastX=e.clientX; lastY=e.clientY;
  } else {
    const hit = hitTest(e.clientX, e.clientY);
    state.hover = hit ? hit.slug : null;
  }
});
cv.addEventListener('pointerup', e => {
  dragging=false; cv.classList.remove('drag');
  if (moved < 6) {
    const hit = hitTest(e.clientX, e.clientY);
    if (hit) {
      if (hit.kind === 'cat') focusCat(hit.cat);
      else selectTool(hit.slug, {focusCam:true});
    }
  }
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const wx = (e.clientX - W/2)/cam.z + cam.x, wy = (e.clientY - H/2)/cam.z + cam.y;
  camT.z = Math.max(0.22, Math.min(2.6, camT.z * Math.exp(-e.deltaY*0.0012)));
  camT.x = wx - (e.clientX - W/2)/camT.z; camT.y = wy - (e.clientY - H/2)/camT.z;
}, {passive:false});

function hitTest(sx, sy) {
  let best = null, bestD = 1e9;
  for (const c of D.categories) {
    const [x,y] = toScreen(HUBS[c.slug].x, HUBS[c.slug].y);
    const d = Math.hypot(sx-x, sy-y);
    if (d < 26 && d < bestD) { best = {kind:'cat', cat:c.slug}; bestD = d; }
  }
  for (const n of NODES) {
    const [x,y] = toScreen(n.x, n.y);
    const d = Math.hypot(sx-x, sy-y);
    if (d < Math.max(10, n.r+4) && d < bestD) { best = {kind:'tool', slug:n.slug}; bestD = d; }
  }
  return best;
}
function focusCat(slug) {
  state.activeCat = slug;
  const h = HUBS[slug];
  camT.x = h.x; camT.y = h.y; camT.z = Math.max(camT.z, 1.15);
}
function selectTool(slug, {focusCam=false} = {}) {
  const t = toolBySlug[slug]; if (!t) return;
  state.selected = slug; state.activeCat = t.cat;
  if (focusCam) { const n = NODES.find(n=>n.slug===slug); camT.x = n.x; camT.y = n.y; camT.z = Math.max(camT.z, 1.5); }
  openPanel(t);
}
function resetView() {
  camT.x=0; camT.y=0; camT.z = Math.min(W/2600, H/1950)*1.12;
  state.selected=null; state.activeCat=null; closePanel();
}
document.getElementById('reset').addEventListener('click', resetView);

/* ---------- panel ---------- */
function openPanel(t) {
  document.body.classList.add('panel-open');
  panel.classList.add('is-open'); panel.setAttribute('aria-hidden','false');
  const cat = catBySlug[t.cat];
  const years = t.until ? `${t.year} – ${t.until}` : `desde ${t.year}`;
  pinner.innerHTML = `
    <div class="panel__meta">${cat ? cat.label : t.cat} · ${years}</div>
    <h2>${t.name}</h2>
    <p class="ctx">${t.ctx}</p>
    ${t.tags.length ? `<h3>Tags</h3><div class="chips">${t.tags.map(g => `<button data-tag="${g}">${g}</button>`).join('')}</div>` : ''}
    ${t.rel.length || t.succ ? `<h3>Relacionadas</h3><div class="rel">` +
      t.rel.map(r => toolBySlug[r] ? `<button data-go="${r}">↗ ${toolBySlug[r].name}</button>` : '').join('') +
      (t.succ && toolBySlug[t.succ] ? `<button data-go="${t.succ}">→ sucesora: ${toolBySlug[t.succ].name}</button>` : '') +
      `</div>` : ''}
    <a class="live" href="https://software-tools.pcabrera.com/tools/${t.slug}" target="_blank" rel="noopener">ver ficha completa ↗</a>`;
  pinner.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => selectTool(b.dataset.go, {focusCam:true})));
  pinner.querySelectorAll('[data-tag]').forEach(b => b.addEventListener('click', () => { qEl.value=b.dataset.tag; runSearch(b.dataset.tag); qEl.focus(); }));
  pinner.scrollTop = 0;
}
function closePanel(){ document.body.classList.remove('panel-open'); panel.classList.remove('is-open'); panel.setAttribute('aria-hidden','true'); }
document.getElementById('pclose').addEventListener('click', closePanel);

/* ---------- leyenda ---------- */
(function(){
  const el = document.getElementById('legend');
  el.innerHTML = D.categories.map(c => `<span><i style="background:${colorOf(c.slug)}"></i>${c.label} (${c.count})</span>`).join('');
})();

/* ---------- render ---------- */
let t0 = performance.now();
function frame(now) {
  const t = (now - t0) / 1000;
  cam.x += (camT.x - cam.x) * 0.085; cam.y += (camT.y - cam.y) * 0.085; cam.z += (camT.z - cam.z) * 0.085;
  ctx.clearRect(0,0,W,H);
  const PLACED = [];
  const HUBLBL = [];

  // fondo
  const bgGrad = ctx.createRadialGradient(W*0.5, H*0.45, 60, W*0.5, H*0.45, Math.max(W,H)*0.75);
  bgGrad.addColorStop(0, 'rgba(16,24,40,1)'); bgGrad.addColorStop(1, 'rgba(7,11,18,1)');
  ctx.fillStyle = bgGrad; ctx.fillRect(0,0,W,H);

  // estrellas con parallax
  for (const s of STARS) {
    const [x,y] = toScreen(s.x*0.55 + cam.x*0.45, s.y*0.55 + cam.y*0.45);
    if (x<-10||x>W+10||y<-10||y>H+10) continue;
    ctx.globalAlpha = s.a; ctx.fillStyle = '#9fb3cd';
    ctx.fillRect(x, y, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  const dim = state.activeCat;
  const sel = state.selected ? toolBySlug[state.selected] : null;

  // nebulosas por categoría
  for (const c of D.categories) {
    const h = HUBS[c.slug]; const [x,y] = toScreen(h.x, h.y);
    const R = h.r * cam.z * 1.5;
    const g = ctx.createRadialGradient(x, y, 4, x, y, R);
    const a = (!dim || dim === c.slug) ? 0.10 : 0.028;
    g.addColorStop(0, hexA(colorOf(c.slug), a)); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fill();
  }

  // nervios hub→herramienta
  ctx.lineWidth = 1;
  for (const n of NODES) {
    const h = HUBS[n.cat]; const [x1,y1] = toScreen(h.x, h.y); const [x2,y2] = toScreen(n.x, n.y);
    ctx.strokeStyle = hexA(colorOf(n.cat), (!dim||dim===n.cat)?0.14:0.04);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }

  // sinapsis (relaciones del seleccionado)
  if (sel) {
    const s = NODES.find(n => n.slug === sel.slug);
    const [sx,sy] = toScreen(s.x, s.y);
    const links = sel.rel.concat(sel.succ && toolBySlug[sel.succ] ? [sel.succ] : []);
    links.forEach((r,i) => {
      const n2 = NODES.find(n => n.slug === r); if (!n2) return;
      const [x2,y2] = toScreen(n2.x, n2.y);
      const mx = (sx+x2)/2, my = (sy+y2)/2 - Math.abs(x2-sx)*0.14 - 12;
      ctx.strokeStyle = (r === sel.succ) ? 'rgba(251,191,36,.8)' : hexA(colorOf(sel.cat), 0.55);
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.quadraticCurveTo(mx,my,x2,y2); ctx.stroke();
    });
  }

  // hubs (categorías)
  for (const c of D.categories) {
    const h = HUBS[c.slug]; const [x,y] = toScreen(h.x, h.y);
    const active = !dim || dim === c.slug;
    const r = 16 + Math.sin(t*1.6 + hash32(c.slug)%628/100) * 0.8;
    ctx.shadowColor = colorOf(c.slug); ctx.shadowBlur = active? 18 : 6;
    ctx.fillStyle = active ? colorOf(c.slug) : hexA(colorOf(c.slug), 0.45);
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#0b0f17'; ctx.font = '700 10px ui-monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(String(h.count), x, y+0.5);
    if (cam.z > 0.3) HUBLBL.push({x, y: y + 30, label: h.label, active});
  }

  // herramientas
  for (const n of NODES) {
    const [x,y] = toScreen(n.x, n.y);
    if (x<-20||x>W+20||y<-20||y>H+20) continue;
    const active = !dim || dim === n.cat;
    const isSel = state.selected === n.slug;
    const isHov = state.hover === n.slug;
    const isLink = sel && (sel.rel.includes(n.slug) || sel.succ === n.slug);
    const r = (isSel ? 9.5 : isHov ? 8 : n.r) * Math.max(cam.z, 0.5);
    ctx.shadowColor = colorOf(n.cat); ctx.shadowBlur = isSel ? 22 : isLink ? 12 : active ? 5 : 2;
    ctx.fillStyle = isSel ? '#eef2f7' : isLink ? colorOf(n.cat) : hexA(colorOf(n.cat), active ? 0.92 : 0.28);
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
    if (isSel) { // anillo pulsante
      ctx.strokeStyle = hexA(colorOf(n.cat), 0.55 + Math.sin(t*5)*0.25);
      ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(x, y, r + 7 + Math.sin(t*5)*2.5, 0, 7); ctx.stroke();
    }
    const showLbl = isSel || isHov || (cam.z > 1.05 && active);
    if (showLbl) {
      const label = toolBySlug[n.slug].name;
      ctx.font = '10px ui-monospace'; ctx.textAlign='left'; ctx.textBaseline='middle';
      const tw = ctx.measureText(label).width;
      const rect = {x: x + r + 6, y: y - 7, w: tw, h: 14};
      const clash = PLACED.some(p => rect.x < p.x + p.w && rect.x + rect.w > p.x && rect.y < p.y + p.h && rect.y + rect.h > p.y);
      if (isSel || isHov || !clash) {
        PLACED.push(rect);
        ctx.strokeStyle = 'rgba(7,11,18,.92)'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
        ctx.strokeText(label, x + r + 6, y + 0.5);
        ctx.fillStyle = isSel ? '#eef2f7' : 'rgba(238,242,247,.8)';
        ctx.fillText(label, x + r + 6, y + 0.5);
      }
    }
  }

  // labels de hubs AL FINAL (no los cruzan los puntos)
  ctx.font = '600 12px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  for (const L of HUBLBL) {
    ctx.strokeStyle = 'rgba(7,11,18,.92)'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
    ctx.strokeText(L.label, L.x, L.y);
    ctx.fillStyle = L.active ? '#eef2f7' : 'rgba(238,242,247,.5)';
    ctx.fillText(L.label, L.x, L.y);
  }

  requestAnimationFrame(frame);
}

function hexA(hex, a){ const v=parseInt(hex.slice(1),16); return `rgba(${(v>>16)&255},${(v>>8)&255},${v&255},${a})`; }

/* ---------- búsqueda ---------- */
const INDEX = D.tools.map(t => ({t, hay:(t.name+' '+t.slug+' '+t.tags.join(' ')+' '+t.ctx).toLowerCase()}));
function searchTools(q) {
  q = q.trim().toLowerCase(); if (!q) return [];
  const out = [];
  for (const {t, hay} of INDEX) {
    const name = t.name.toLowerCase(); let s = -1;
    if (name.startsWith(q)) s = 0; else if (name.includes(q)) s = 1;
    else if (t.tags.some(g => g.toLowerCase().includes(q))) s = 2;
    else if (hay.includes(q)) s = 3;
    if (s >= 0) out.push({t, s});
  }
  return out.sort((a,b)=>a.s-b.s||a.t.name.localeCompare(b.t.name)).slice(0,8).map(x=>x.t);
}
function runSearch(q) {
  const res = searchTools(q);
  ddEl.innerHTML='';
  if (!q.trim()) { ddEl.classList.remove('is-open'); return; }
  if (!res.length) { ddEl.innerHTML = `<div class="empty">sin resultados para «${q.trim()}»</div>`; ddEl.classList.add('is-open'); return; }
  res.forEach(t => {
    const b = document.createElement('button');
    b.innerHTML = `${t.name}<span>${(catBySlug[t.cat]||{label:t.cat}).label} · ${t.year}</span>`;
    b.addEventListener('click', () => { ddEl.classList.remove('is-open'); qEl.value=''; selectTool(t.slug, {focusCam:true}); });
    ddEl.appendChild(b);
  });
  ddEl.classList.add('is-open');
}
qEl.addEventListener('input', () => runSearch(qEl.value));
qEl.addEventListener('keydown', e => {
  if (e.key === 'Escape') { ddEl.classList.remove('is-open'); qEl.blur(); }
  if (e.key === 'Enter') { const f = ddEl.querySelector('button'); if (f) f.click(); }
});
document.addEventListener('click', e => { if (!e.target.closest('.hd__search')) ddEl.classList.remove('is-open'); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && panel.classList.contains('is-open')) closePanel();
  if (e.key === '/' && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); }
});

/* ---------- arranque ---------- */
resize();
const qs = new URLSearchParams(location.search);
const dt = qs.get('tool'), dc = qs.get('cat');
if (dt && toolBySlug[dt]) { const n = NODES.find(n=>n.slug===dt); cam.x=camT.x=n.x; cam.y=camT.y=n.y; cam.z=camT.z=1.5; selectTool(dt); }
else if (dc && catBySlug[dc]) { focusCat(dc); cam.x=camT.x=HUBS[dc].x; cam.y=camT.y=HUBS[dc].y; }
requestAnimationFrame(frame);
})();
</script>
